# btps-node CI.
#
# example-app  - The example app, built against the SDK. The example
#                depends on the SDK through `portal:../..` and the SDK's
#                `main` points at ./dist, so the root package is built
#                *before* the example is installed. Both installs are
#                --immutable, on a fresh checkout with no hand-built
#                artifacts. Then the example itself is built (`nest build`),
#                its jest specs run, and the @btps/sdk smoke test
#                (examples/btps-nest-app/smoke/sdk-subpaths.mjs) imports
#                every SDK subpath the app uses and every compiled app module
#                that uses one. The smoke test is plain Node ESM, not jest:
#                ts-jest compiles to CommonJS and the SDK's exports map has
#                only an "import" condition, so a jest spec cannot prove the
#                app loads the SDK at runtime. Before the root build it runs
#                the packaging checks (tests/packaging, scoped), so its
#                portal-checksum gate is enforced on every PR.
# pack-smoke   - Proves the artifact a consumer would
#                receive: `yarn pack` at the root, install the tarball in an
#                empty project outside the checkout (not --immutable: it has
#                no lockfile), check that @btps/sdk resolved to a real copy
#                inside that project rather than a portal:/symlink back into
#                the repo, then import it.
# docker-image - Builds the btps-server image through
#                examples/btps-nest-app/docker-compose.yml (build context =
#                the repository root, which is where the portal:../..-linked
#                @btps/sdk lives) on a fresh checkout. The Dockerfile itself
#                fails the build if the app's SDK smoke test fails or if
#                @btps/sdk cannot be imported in the production stage, so a
#                green run covers criteria 1 and 2 too. It only builds the
#                image: nothing is pushed and no container is started.
# ci/test      - The root `yarn test` (vitest run --coverage, the unit suite). It
#                fails when coverage is under the minimums in vitest.config.ts.
#                Root vitest also collects examples/btps-nest-app/src/*.spec.ts,
#                and database.module.spec.ts imports @nestjs/testing from the
#                example's node_modules, so the example is installed first.
# ci/vectors   - `yarn verify:btps-vectors`, which runs with
#                --known-failing test/vectors/known-failing.json (the root
#                package.json script). It bundles the SDK from src with
#                esbuild, so it needs no build.
# ci/e2e       - `yarn test:e2e`: every BTPS journey, happy and wrong paths,
#                against real BtpsServers over TLS (tests/e2e).
# ci/security  - `yarn test:security`: attacks, spoofing, spam and probing
#                against real BtpsServers over TLS (tests/security).
#
# ci/test, ci/vectors, ci/e2e and ci/security are required status checks, matched by
# name, so renaming any of them breaks the rule. example-app stays the
# first job: tests/packaging/ci-workflow.test.mjs finds "the example job" as
# the first one that works in examples/btps-nest-app.
#
# This workflow runs on pull_request from forks with contents: read and no
# secrets. Any step needing a secret or write access belongs in a separate
# workflow, not this one. btps-node's only integration branch is master.
#
# Pins: actions by commit SHA (release tag in the comment), resolved with
# `gh api repos/<action>/commits/<tag>` on 2026-10-07. Corepack is pinned to
# 0.34.7, whose engines include the Node in .nvmrc (24.22.0), and installed
# before `corepack enable`, so every job fetches Yarn with the same Corepack
# whatever version the Node release bundles.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale PR runs; never cancel a run on master.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example-app:
    name: btps-nest-app (root build, then install --immutable, build, test, SDK smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.34.7 && corepack enable
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Packaging checks (portal checksum gate, dependency spec, workflow shape)
        run: yarn vitest run tests/packaging
      - name: Build @btps/sdk (main points at dist)
        run: yarn build
      - name: Install example dependencies
        working-directory: examples/btps-nest-app
        run: yarn install --immutable
      - name: Build example (nest build)
        working-directory: examples/btps-nest-app
        run: yarn build
      - name: Test example
        working-directory: examples/btps-nest-app
        run: yarn test
      - name: "@btps/sdk smoke: import every subpath the app uses, and its compiled modules"
        working-directory: examples/btps-nest-app
        run: yarn test:sdk-smoke

  pack-smoke:
    name: pack-smoke (yarn pack, install tarball, import @btps/sdk)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.34.7 && corepack enable
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Build @btps/sdk
        run: yarn build
      - name: Pack
        run: yarn pack -o "$RUNNER_TEMP/btps-sdk.tgz"
      - name: Install the tarball in an empty project and import @btps/sdk
        run: |
          mkdir "$RUNNER_TEMP/pack-smoke"
          cd "$RUNNER_TEMP/pack-smoke"
          echo '{"name":"btps-pack-smoke","version":"0.0.0","private":true}' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP/btps-sdk.tgz"
          # Criterion 4: the import must come from the installed tarball, not
          # from a portal:/link back into the checkout.
          test -d node_modules/@btps/sdk && test ! -L node_modules/@btps/sdk
          node --input-type=module -e "
            import fs from 'node:fs';
            import path from 'node:path';
            import { fileURLToPath } from 'node:url';
            const resolved = fs.realpathSync(fileURLToPath(import.meta.resolve('@btps/sdk')));
            const expected = path.join(fs.realpathSync(process.cwd()), 'node_modules/@btps/sdk') + path.sep;
            if (!resolved.startsWith(expected)) {
              console.error('@btps/sdk resolved outside the installed tarball: ' + resolved);
              process.exit(1);
            }
            await import('@btps/sdk');
            console.log('import @btps/sdk OK from ' + resolved);
          "

  test:
    name: ci/test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.34.7 && corepack enable
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Install example dependencies (root vitest collects its specs)
        working-directory: examples/btps-nest-app
        run: yarn install --immutable
      - name: yarn test
        run: yarn test

  docker-image:
    name: btps-server Docker image (docker compose build, fresh checkout)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .env.docker is gitignored (.env*), so a fresh checkout has none, and
      # Compose refuses to load a project whose env_file is missing, even to
      # build. The image does not read it (env_file is a runtime setting), so
      # an empty one is enough here. If a real one exists, it is left alone.
      - name: Provide an empty .env.docker (runtime-only; gitignored)
        working-directory: examples/btps-nest-app
        run: test -f .env.docker || touch .env.docker
      - name: docker compose build btps-server
        run: docker compose -f examples/btps-nest-app/docker-compose.yml build btps-server

  e2e:
    name: ci/e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.34.7 && corepack enable
      - name: Install root dependencies
        run: yarn install --immutable
      # Every BTPS journey, happy and wrong paths, against real BtpsServers over
      # TLS (tests/e2e). openssl, on the runner, makes their certificate.
      - name: yarn test:e2e
        run: yarn test:e2e

  security:
    name: ci/security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.34.7 && corepack enable
      - name: Install root dependencies
        run: yarn install --immutable
      # Attacks, spoofing, spam and probing against real BtpsServers over TLS
      # (tests/security), on the e2e harness.
      - name: yarn test:security
        run: yarn test:security

  vectors:
    name: ci/vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.34.7 && corepack enable
      - name: Install root dependencies
        run: yarn install --immutable
      - name: yarn verify:btps-vectors (with --known-failing)
        run: yarn verify:btps-vectors
