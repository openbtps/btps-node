# Publish @btps/sdk to npm, staged.
#
# A tag vX.Y.Z on master starts it. The job runs in the npm-publish
# environment, so it waits for the maintainer's approval on GitHub. It then
# stages the version with `npm stage publish` through npm trusted publishing
# (OIDC): no npm token exists anywhere. A staged version is not installable
# until a maintainer approves it on npm with 2FA (`npm stage approve <id>`),
# because this trusted publisher is allowed to stage only, never to publish.
#
# Refuses before staging when the tag is not on master, or when it does not
# match package.json's version. master only takes pull requests that passed
# the required checks, so what is staged has been tested; the build here is
# the one that is packed. A pre-release version (1.2.0-beta.1) is staged under
# the `next` tag, never `latest`.
#
# Pins match ci.yml. npm is pinned to 11.19.0, which has `npm stage`.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: npm stage publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Enable Yarn via Corepack, and an npm with `npm stage`
        run: npm install -g corepack@0.34.7 npm@11.19.0 && corepack enable
      - name: The tag is on master and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
          case "$version" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      - name: Install root dependencies
        run: yarn install --immutable
      - name: Build @btps/sdk
        run: yarn build
      - name: Stage on npm
        run: npm stage publish --tag "$NPM_TAG"
